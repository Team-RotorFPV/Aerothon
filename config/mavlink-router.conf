# Configuration for mavlink-routerd (AeroTHON Mission 2)
# Routes MAVLink simultaneously to MAVROS and Mission Planner / QGroundControl

[General]
ReportStats=false
MavlinkDialect=ardupilotmega

# Primary Flight Controller input (SITL or Serial Pixhawk)
[UdpEndpoint sitl_in]
Mode=Server
Address=0.0.0.0
Port=14560

# MAVROS Endpoint (ROS 2 Node)
[UdpEndpoint mavros_out]
Mode=Normal
Address=127.0.0.1
Port=14555

# Mission Planner / QGC Endpoint 1
[UdpEndpoint gcs_mission_planner]
Mode=Server
Address=0.0.0.0
Port=14550

# Secondary GCS / Logging Endpoint
[UdpEndpoint gcs_secondary]
Mode=Server
Address=0.0.0.0
Port=14551
