# Without this, setuptools installs console_scripts into install/<pkg>/bin/ and
# ros2 launch aborts the ENTIRE launch with
#   "package found ... but libexec directory ... does not exist"
# then SIGINTs every process it had already started. That failure was
# misdiagnosed for hours as an environment problem (see VERIFICATION.md 3.6).
[develop]
script_dir=$base/lib/mission_bringup
[install]
install_scripts=$base/lib/mission_bringup
